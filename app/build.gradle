import com.android.build.api.variant.BuildConfigField
import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
}

android {
    namespace = "ivica.weatherapplication"
    compileSdk {
        version = release(37) { minorApiLevel = 0 }
    }
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "ivica.weatherapplication"
        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "OPENWEATHER_API_KEY", '""'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

// The provider is attached only to debug and is not evaluated by release tasks.
androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.buildConfigFields.put("OPENWEATHER_API_KEY", providers.provider {
            def path = rootProject.file("debug-weather.properties").toPath()
            String key = ""
            if (java.nio.file.Files.exists(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                if (!java.nio.file.Files.isRegularFile(path, java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                    throw new GradleException("Debug weather configuration must be a regular local file.")
                }
                if (java.nio.file.Files.getFileStore(path).supportsFileAttributeView("posix")) {
                    def expected = java.nio.file.attribute.PosixFilePermissions.fromString("rw-------")
                    if (java.nio.file.Files.getPosixFilePermissions(path) != expected) {
                        throw new GradleException("Debug weather configuration requires owner-only permissions (0600).")
                    }
                }
                try {
                    def properties = new Properties()
                    java.nio.file.Files.newInputStream(path).withCloseable { properties.load(it) }
                    key = properties.getProperty("OPENWEATHER_API_KEY", "").trim()
                    if (key && !(key ==~ /[A-Za-z0-9]{16,128}/)) {
                        throw new IllegalArgumentException()
                    }
                } catch (Exception ignored) {
                    throw new GradleException("Invalid debug weather configuration; use the local key-entry script.")
                }
            }
            new BuildConfigField("String", JsonOutput.toJson(key), "Local debug configuration only")
        })
    }
}

// Never export credential-bearing debug outputs to a build cache or serialize
// debug configuration into a configuration cache. Normal local outputs stay private.
tasks.configureEach {
    if (name.toLowerCase(Locale.ROOT).contains("debug")) {
        outputs.doNotCacheIf("Debug outputs can contain a local API key") { true }
        notCompatibleWithConfigurationCache("Debug configuration can contain a local API key")
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
}